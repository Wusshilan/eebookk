appId: com.eebookk.desktop
productName: eebookk
copyright: Copyright © 2026 就一直

directories:
  output: release
  buildResources: build

files:
  - out/**/*
  - package.json

asar: true

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: eebookk
  deleteAppDataOnUninstall: false
  installerLanguages:
    - zh_CN
  language: '2052'
